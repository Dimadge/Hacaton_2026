# Локальная разработка: Docker Compose автоматически читает этот файл.
# Старт: docker compose up -d --build
services:
  db-upgrade:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./db:/db:ro
      - ./db/startup_migrate.sh:/upgrade/startup_migrate.sh:ro
    entrypoint: ["sh", "/upgrade/startup_migrate.sh"]
    depends_on:
      db:
        condition: service_healthy

  db-role:
    depends_on:
      db-upgrade:
        condition: service_completed_successfully

  demo-init:
    build: .
    restart: "no"
    command: ["python", "-m", "app.seed"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:?Set DEMO_CLIENT_PASSWORD}
      DEMO_BANK_PASSWORD: ${DEMO_BANK_PASSWORD:?Set DEMO_BANK_PASSWORD}
    depends_on:
      db-role:
        condition: service_completed_successfully

  api:
    depends_on:
      demo-init:
        condition: service_completed_successfully
